name: Publish public BotSesh client
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this reviewed version (requires npm trust and environment approval)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/sync-npm-client.mjs --check
      - run: node --test --test-concurrency=2 tests/npm-client.test.mjs
  publish:
    if: inputs.publish == true && github.repository == 'meowsigma/botsesh-agent'
    needs: test
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - run: node scripts/sync-npm-client.mjs --check
      - run: npm pack --dry-run --json
        working-directory: packages/botsesh
      - run: npm publish --access public --provenance
        working-directory: packages/botsesh
